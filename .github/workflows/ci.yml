name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Integration tests (tests/integration) are local-only: the IRIS image runs out of memory on GitHub runners.
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -v
